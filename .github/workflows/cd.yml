name: CD

# Entrega continua: empacota o uberjar, publica como artefato e faz o
# "deploy" validando a aplicacao ja empacotada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Empacotar o uberjar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          # Versao fixa: com "latest" o CLI pode apontar para uma versao base do
          # Clojure que ainda nao foi publicada no Maven Central, quebrando o build.
          cli: 1.12.4.1618

      - name: Cache das dependencias
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-

      - name: Gerar o uberjar
        run: clojure -T:build uber

      - name: Publicar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: url-shortener-uberjar
          path: target/*-standalone.jar
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy e smoke test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Baixar o artefato gerado no build
        uses: actions/download-artifact@v4
        with:
          name: url-shortener-uberjar
          path: ./deploy

      - name: Listar o que sera implantado
        run: ls -lh ./deploy

      - name: Subir a aplicacao empacotada
        run: |
          JAR=$(ls ./deploy/*-standalone.jar | head -1)
          echo "Subindo $JAR"
          nohup java -jar "$JAR" > servidor.log 2>&1 &
          echo $! > servidor.pid

      - name: Smoke test dos endpoints
        run: |
          for tentativa in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              break
            fi
            echo "Aguardando a aplicacao subir... ($tentativa/20)"
            sleep 3
          done

          echo "--- GET /health ---"
          curl -fsS http://localhost:3000/health
          echo ""

          echo "--- POST /shorten ---"
          curl -fsS -X POST http://localhost:3000/shorten \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.pucpr.br"}'
          echo ""

          echo "--- GET /0 (deve responder 302) ---"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/0)
          echo "HTTP $codigo"
          test "$codigo" = "302"

          echo "Smoke test concluido com sucesso."

      - name: Logs da aplicacao
        if: always()
        run: cat servidor.log || true

      - name: Encerrar a aplicacao
        if: always()
        run: kill "$(cat servidor.pid)" || true
